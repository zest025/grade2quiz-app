<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二年级每日答题闯关与学习积分系统</title>
  <!-- Tailwind CSS & Cartoon Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
  <style>
    .font-kuaile { font-family: 'ZCOOL KuaiLe', cursive, sans-serif; }
    .bg-cartoon {
      background-color: #f0fdf4;
      background-image: radial-gradient(#bbf7d0 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    /* 专门打印优化样式 */
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      header, 
      .no-print,
      #parent-panel,
      #shop-container,
      #stats-container,
      #mistakes-container,
      button, 
      footer {
        display: none !important;
      }
      #quiz-container {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .quiz-card {
        border: none !important;
        box-shadow: none !important;
        padding: 4px 0 !important;
        margin-bottom: 12px !important;
        break-inside: avoid;
      }
      h3 {
        font-size: 14pt !important;
        color: black !important;
      }
      label {
        font-size: 12pt !important;
        border: 1px solid #ccc !important;
        break-inside: avoid;
        margin-bottom: 4px !important;
      }
    }
  </style>
</head>
<body class="bg-cartoon min-h-screen text-gray-800 flex flex-col justify-between p-4 md:p-6">

  <!-- 头部导航 -->
  <header class="max-w-4xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-md mb-6 no-print gap-4">
    <div class="flex items-center gap-3">
      <span class="text-4xl">✏️</span>
      <div>
        <h1 class="text-2xl font-bold text-green-700 font-kuaile">二年级学习闯关卡</h1>
        <p class="text-xs text-gray-500">苏教版同步 · 每日打卡 · 积分兑换</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="bg-yellow-100 border border-yellow-300 px-4 py-2 rounded-xl text-center">
        <span class="text-xs text-yellow-700 block">当前积累积分</span>
        <span id="current-score" class="text-2xl font-bold text-yellow-600 font-kuaile">0</span>
      </div>
      <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-2 rounded-xl text-sm shadow transition">
        🖨️ 打印今日试卷
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full space-y-6">

    <!-- ⚙️ 家长控制与云端设置面板 -->
    <section id="parent-panel" class="bg-white p-5 rounded-2xl shadow-sm border border-green-100 no-print">
      <div class="flex justify-between items-center cursor-pointer" onclick="toggleParentSettings()">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2 font-kuaile">
          <span>⚙️</span> 家长控制与云端同步设置
        </h2>
        <span id="toggle-icon" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md">展开设置 🔽</span>
      </div>

      <div id="parent-settings-content" class="hidden mt-4 pt-4 border-t border-gray-100 space-y-4">
        <!-- 1. 云端同步配置 -->
        <div>
          <h3 class="text-xs font-bold text-gray-500 mb-2">☁️ 云端自动同步状态 (<span id="auto-sync-status" class="text-green-600">已启用后台同步</span>)</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <input type="text" id="sync-key" placeholder="JSONBin Master Key ($2a$10$...)" class="border rounded-xl px-3 py-2 text-xs w-full focus:outline-none focus:ring-2 focus:ring-green-400">
            <input type="text" id="sync-id" placeholder="同步标识/学生ID (例: kid_8888)" class="border rounded-xl px-3 py-2 text-xs w-full focus:outline-none focus:ring-2 focus:ring-green-400">
            <div class="flex gap-2">
              <button onclick="uploadToCloud(false)" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold text-xs py-2 rounded-xl shadow transition">
                ☁️ 手动上传
              </button>
              <button onclick="downloadFromCloud()" class="flex-1 bg-purple-500 hover:bg-purple-600 text-white font-bold text-xs py-2 rounded-xl shadow transition">
                📥 拉取数据
              </button>
            </div>
          </div>
        </div>

        <!-- 2. 家长手动调整积分与数据重置 -->
        <div class="pt-2 border-t border-gray-100 flex flex-wrap items-center justify-between gap-3 text-xs">
          <div class="flex items-center gap-2">
            <span class="font-bold text-gray-700">手动修改积分：</span>
            <input type="number" id="manual-score-input" placeholder="输入新积分" class="border rounded-lg px-2 py-1 w-24 text-xs">
            <button onclick="updateScoreManually()" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-1 rounded-lg">保存积分</button>
          </div>
          <button onclick="resetTodayStatus()" class="text-red-500 hover:text-red-700 underline text-xs">
            ⚠️ 重置今日答题状态（方便测试）
          </button>
        </div>
      </div>
    </section>

    <!-- 🎯 答题区域 -->
    <section id="quiz-container" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-4 no-print border-b pb-3">
        <h2 class="text-xl font-bold text-gray-800 font-kuaile" id="quiz-date-title">今日核心练习</h2>
        <span class="text-xs bg-green-100 text-green-700 px-2.5 py-1 rounded-full font-bold">每题 1 分 · 共 5 分</span>
      </div>
      
      <div id="questions-list" class="space-y-6">
        <!-- 动态渲染题目 -->
      </div>

      <div class="mt-6 pt-4 border-t border-gray-100 flex justify-end no-print">
        <button onclick="submitQuiz()" id="submit-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg transition text-lg font-kuaile">
          提交答案并领取积分 🚀
        </button>
      </div>
    </section>

    <!-- 📊 统计与错题集 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 no-print">
      <!-- 错题本 -->
      <section id="mistakes-container" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-bold text-red-600 mb-3 flex items-center gap-2 font-kuaile">
          <span>📖</span> 错题自动收集本
        </h3>
        <div id="mistakes-list" class="space-y-2 text-sm text-gray-600 max-h-48 overflow-y-auto">
          <p class="text-gray-400 italic">太棒了，目前没有累积的错题！</p>
        </div>
      </section>

      <!-- 家长兑换商城 -->
      <section id="shop-container" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-bold text-yellow-600 mb-3 flex items-center gap-2 font-kuaile">
          <span>🎁</span> 积分心愿兑换
        </h3>
        <div class="flex gap-2">
          <input type="text" id="reward-name" placeholder="心愿名称 (例: 看动画片30分钟)" class="border rounded-xl px-3 py-2 text-xs flex-1">
          <input type="number" id="reward-cost" placeholder="需积分" class="border rounded-xl px-3 py-2 text-xs w-20">
          <button onclick="addReward()" class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs px-3 py-2 rounded-xl font-bold">添加</button>
        </div>
        <div id="rewards-list" class="mt-3 space-y-2 max-h-36 overflow-y-auto text-xs">
          <!-- 动态渲染奖励 -->
        </div>
      </section>
    </div>

  </main>

  <footer class="max-w-4xl mx-auto w-full text-center text-xs text-gray-400 mt-8 no-print">
    二年级学习辅助系统 · 保持连贯打卡与练习
  </footer>

  <script>
    const defaultQuizData = [
      { id: 1, type: 'math', q: '计算算式 45 ➕ 28 ➖ 19 的正确结果是多少？', options: ['A. 54', 'B. 64', 'C. 44', 'D. 73'], ans: 0, parse: '按顺序计算：45+28=73，73-19=54。' },
      { id: 2, type: 'math', q: '计算算式 5 ✖️ 4 时，用到的乘法口诀是？', options: ['A. 四五二十', 'B. 五五二十五', 'C. 三五十五', 'D. 四六二十四'], ans: 0, parse: '根据口诀“四五二十”计算 5✖️4=20。' },
      { id: 3, type: 'math', q: '测量数学课本的厚度大约是 1（ ），小明的身高大约是 130（ ）。', options: ['A. 厘米；厘米', 'B. 米；厘米', 'C. 厘米；米', 'D. 米；米'], ans: 0, parse: '课本厚度用“厘米”，身高用“厘米”。' },
      { id: 4, type: 'chinese', q: '生字“装”的结构和部首是什么？', options: ['A. 上下结构，部首是“衣”', 'B. 左右结构，部首是“壮”', 'C. 半包围结构，部首是“衣”', 'D. 上下结构，部首是“壮”'], ans: 0, parse: '“装”上壮下衣，属于上下结构，部首是“衣”。' },
      { id: 5, type: 'chinese', q: '补全古诗《梅花》：“遥知不是雪，________________。”', options: ['A. 为有暗香来', 'B. 粒粒皆辛苦', 'C. 乡音无改鬓毛衰', 'D. 处处闻啼鸟'], ans: 0, parse: '出处：王安石《梅花》“遥知不是雪，为有暗香来”。' }
    ];

    let appState = {
      score: 0,
      mistakes: [],
      rewards: [
        { name: '看动画片 30 分钟', cost: 10 },
        { name: '游乐场门票一次', cost: 50 }
      ],
      completedDates: [],
      syncKey: '',
      syncId: ''
    };

    window.onload = function() {
      loadLocalStorage();
      renderQuiz();
      renderState();
    };

    function toggleParentSettings() {
      const content = document.getElementById('parent-settings-content');
      const icon = document.getElementById('toggle-icon');
      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.innerText = '收起设置 🔼';
      } else {
        content.classList.add('hidden');
        icon.innerText = '展开设置 🔽';
      }
    }

    function loadLocalStorage() {
      const saved = localStorage.getItem('grade2_app_state');
      if (saved) {
        try { appState = { ...appState, ...JSON.parse(saved) }; } catch(e){}
      }
      document.getElementById('sync-key').value = appState.syncKey || '';
      document.getElementById('sync-id').value = appState.syncId || '';
    }

    function saveLocalStorage() {
      appState.syncKey = document.getElementById('sync-key').value.trim();
      appState.syncId = document.getElementById('sync-id').value.trim();
      localStorage.setItem('grade2_app_state', JSON.stringify(appState));
    }

    function renderQuiz() {
      const list = document.getElementById('questions-list');
      list.innerHTML = defaultQuizData.map((q, idx) => `
        <div class="quiz-card p-4 rounded-xl bg-gray-50 border border-gray-100">
          <h3 class="font-bold text-gray-800 mb-3">${idx + 1}. [${q.type === 'math' ? '数学' : '语文'}] ${q.q}</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${q.options.map((opt, oIdx) => `
              <label class="flex items-center gap-2 p-2.5 rounded-lg border bg-white cursor-pointer hover:bg-green-50 transition text-sm">
                <input type="radio" name="q_${q.id}" value="${oIdx}" class="text-green-600 focus:ring-green-500">
                <span>${opt}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');

      const today = new Date().toLocaleDateString();
      document.getElementById('quiz-date-title').innerText = `今日核心练习 (${today})`;
    }

    function renderState() {
      document.getElementById('current-score').innerText = appState.score;
      
      const mList = document.getElementById('mistakes-list');
      if (appState.mistakes.length === 0) {
        mList.innerHTML = `<p class="text-gray-400 italic">太棒了，目前没有累积的错题！</p>`;
      } else {
        mList.innerHTML = appState.mistakes.map((m, i) => `
          <div class="p-2 bg-red-50 rounded border border-red-100 text-xs">
            <span class="font-bold text-red-700">错题 ${i+1}:</span> ${m.q} 
            <div class="text-gray-500 mt-1">解析: ${m.parse}</div>
          </div>
        `).join('');
      }

      const rList = document.getElementById('rewards-list');
      rList.innerHTML = appState.rewards.map((r, i) => `
        <div class="flex justify-between items-center p-2 bg-yellow-50 rounded border border-yellow-100">
          <span>${r.name} (${r.cost}分)</span>
          <button onclick="redeemReward(${i})" class="bg-yellow-500 hover:bg-yellow-600 text-white px-2 py-1 rounded text-xs">兑换</button>
        </div>
      `).join('');

      saveLocalStorage();
    }

    // --- 🎯 答题提交并【自动后台静默同步】 ---
    function submitQuiz() {
      const today = new Date().toLocaleDateString();
      if (appState.completedDates.includes(today)) {
        alert('今天已经完成答题并领取过积分了哦！明天继续加油！');
        return;
      }

      let earned = 0;
      defaultQuizData.forEach(q => {
        const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
        if (selected && parseInt(selected.value) === q.ans) {
          earned += 1;
        } else {
          if (!appState.mistakes.some(m => m.id === q.id)) {
            appState.mistakes.push(q);
          }
        }
      });

      appState.score += earned;
      appState.completedDates.push(today);
      renderState();
      
      alert(`答题完成！本次获得 ${earned} 积分，累计积分：${appState.score}`);

      // 🚀 核心：如果家长已经配置了 Key 和 ID，在后台静默同步，不弹任何烦人提示
      if (appState.syncKey && appState.syncId) {
        uploadToCloud(true); 
      }
    }

    function addReward() {
      const name = document.getElementById('reward-name').value.trim();
      const cost = parseInt(document.getElementById('reward-cost').value);
      if (name && cost > 0) {
        appState.rewards.push({ name, cost });
        document.getElementById('reward-name').value = '';
        document.getElementById('reward-cost').value = '';
        renderState();
      }
    }

    function redeemReward(idx) {
      const r = appState.rewards[idx];
      if (appState.score >= r.cost) {
        if (confirm(`确定花费 ${r.cost} 积分兑换“${r.name}”吗？`)) {
          appState.score -= r.cost;
          renderState();
          alert('兑换成功！去找家长兑现承诺吧！');
          // 兑换奖品后也自动后台同步一次
          if (appState.syncKey && appState.syncId) { uploadToCloud(true); }
        }
      } else {
        alert('积分不够哦，再接再厉！');
      }
    }

    function updateScoreManually() {
      const val = parseInt(document.getElementById('manual-score-input').value);
      if (!isNaN(val) && val >= 0) {
        appState.score = val;
        renderState();
        alert(`积分已手动调整为：${val}`);
        if (appState.syncKey && appState.syncId) { uploadToCloud(true); }
      }
    }

    function resetTodayStatus() {
      const today = new Date().toLocaleDateString();
      appState.completedDates = appState.completedDates.filter(d => d !== today);
      saveLocalStorage();
      alert('已重置今日答题状态，现在可以重新测试了！');
    }

    // --- ☁️ 云端 API 核心同步逻辑 (支持 silent 静默后台上传) ---
    async function uploadToCloud(silent = false) {
      const key = document.getElementById('sync-key').value.trim();
      const syncId = document.getElementById('sync-id').value.trim();

      if (!key || !syncId) {
        if (!silent) alert('请先填写 JSONBin Master Key 和 同步标识/学生ID！');
        return;
      }

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': key,
            'X-Bin-Name': `quiz_${syncId}`
          },
          body: JSON.stringify(appState)
        });

        if (res.ok) {
          if (!silent) alert('手动上传云端成功！');
        } else {
          if (!silent) alert('上传失败，请检查 Key 是否正确。');
        }
      } catch (e) {
        if (!silent) alert('网络连接错误，同步失败。');
      }
    }

    async function downloadFromCloud() {
      const key = document.getElementById('sync-key').value.trim();
      const syncId = document.getElementById('sync-id').value.trim();

      if (!key || !syncId) {
        alert('请先填写 JSONBin Master Key 和 同步标识/学生ID！');
        return;
      }

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/c/uncategorized/bins`, {
          headers: { 'X-Master-Key': key }
        });
        const binsData = await res.json();
        
        const targetBin = binsData.find(b => b.snippetMeta && b.snippetMeta.name === `quiz_${syncId}`);
        if (!targetBin) {
          alert(`未在云端找到 ID 为 [${syncId}] 的备份记录。`);
          return;
        }

        const dataRes = await fetch(`https://api.jsonbin.io/v3/b/${targetBin.record}`, {
          headers: { 'X-Master-Key': key }
        });
        const cloudData = await dataRes.json();
        
        if (cloudData.record) {
          appState = { ...appState, ...cloudData.record };
          renderState();
          alert('数据同步成功！已恢复云端的最新积分和错题记录。');
        }
      } catch (e) {
        alert('拉取数据失败，请检查网络或配置信息。');
      }
    }
  </script>
</body>
</html>
