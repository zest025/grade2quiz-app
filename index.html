<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二年级上册·每日快乐闯关答题</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
    .font-kuaile { font-family: 'ZCOOL KuaiLe', cursive, sans-serif; }
    .bg-cartoon {
      background-color: #f0fdf4;
      background-image: radial-gradient(#bbf7d0 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-cartoon min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header Section -->
  <header class="bg-emerald-500 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-graduation-cap text-3xl text-yellow-300"></i>
        <h1 class="text-2xl font-bold font-kuaile tracking-wider">每日快乐闯关</h1>
      </div>
      
      <div class="flex items-center space-x-4">
        <!-- Score Counter Badge -->
        <div class="bg-emerald-600 border-2 border-yellow-300 rounded-full px-4 py-1 flex items-center space-x-2 shadow-inner">
          <i class="fa-solid fa-star text-yellow-300 text-xl animate-bounce"></i>
          <span class="text-sm font-semibold text-emerald-100">当前总积分:</span>
          <span id="total-score-display" class="text-2xl font-bold text-yellow-300">0</span>
        </div>
        
        <!-- Parent Mode Toggle Button -->
        <button onclick="openParentModal()" class="bg-emerald-700 hover:bg-emerald-800 text-emerald-100 p-2 rounded-lg text-sm transition flex items-center gap-1">
          <i class="fa-solid fa-user-gear"></i> 家长设置
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto w-full p-4 flex-grow">
    
    <!-- Navigation Tabs -->
    <div class="flex justify-center space-x-4 mb-6">
      <button id="tab-quiz-btn" onclick="switchTab('quiz')" class="px-6 py-2 rounded-full font-bold text-lg shadow-md transition bg-amber-400 text-amber-950 scale-105">
        <i class="fa-solid fa-gamepad mr-2"></i>今日答题闯关
      </button>
      <button id="tab-shop-btn" onclick="switchTab('shop')" class="px-6 py-2 rounded-full font-bold text-lg shadow-md transition bg-white text-emerald-700 hover:bg-emerald-50">
        <i class="fa-solid fa-gift mr-2"></i>心愿奖品兑换
      </button>
    </div>

    <!-- TAB 1: QUIZ CONTAINER -->
    <div id="quiz-container" class="space-y-6">
      <!-- Status Card -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-emerald-100 flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold text-emerald-800 flex items-center gap-2">
            <i class="fa-solid fa-calendar-day text-amber-500"></i> 苏教版二年级上册·每日精炼
            <span id="deck-tag" class="text-xs bg-emerald-100 text-emerald-700 font-normal px-2 py-0.5 rounded-full">套题 1</span>
          </h2>
          <p class="text-slate-500 text-sm mt-1">共 5 道题，每题 1 分。每日根据日期自动更换题库！</p>
        </div>
        <div class="flex gap-2">
          <button onclick="shuffleDeck()" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-3 py-1.5 rounded-lg border border-amber-300 transition flex items-center gap-1">
            <i class="fa-solid fa-shuffle"></i> 换一批
          </button>
          <button id="reset-today-btn" onclick="resetTodayQuiz()" class="hidden text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg border">
            重新测试
          </button>
        </div>
      </div>

      <!-- Quiz Form -->
      <form id="quiz-form" onsubmit="handleQuizSubmit(event)" class="space-y-6">
        <div id="questions-list" class="space-y-6"></div>

        <!-- Submit Button Container -->
        <div class="pt-4 text-center">
          <button type="submit" id="submit-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xl px-10 py-3 rounded-2xl shadow-lg border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1 transition">
            🚀 提交答案，领取积分
          </button>
        </div>
      </form>

      <!-- Results Alert Card -->
      <div id="quiz-result-card" class="hidden bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-6 text-center shadow-lg space-y-3">
        <div class="text-4xl">🎉</div>
        <h3 class="text-2xl font-bold text-emerald-800" id="result-title">太棒啦！交卷成功</h3>
        <p class="text-slate-700 text-lg" id="result-score-text"></p>
        <p class="text-sm text-slate-500">提示：下拉可以查看每道题的详细解答与知识点剖析哦！</p>
      </div>
    </div>

    <!-- TAB 2: SHOP CONTAINER -->
    <div id="shop-container" class="hidden space-y-6">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-emerald-100">
        <h2 class="text-xl font-bold text-emerald-800 flex items-center gap-2">
          <i class="fa-solid fa-store text-pink-500"></i> 心愿奖品小天地
        </h2>
        <p class="text-slate-500 text-sm mt-1">用答题赚来的积分，向爸爸妈妈兑换奖品吧！</p>
      </div>

      <div id="rewards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
  </main>

  <!-- Parent Modal -->
  <div id="parent-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeParentModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>
      
      <div class="border-b pb-3">
        <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-emerald-600"></i> 家长后台设置
        </h3>
        <p class="text-xs text-slate-500 mt-1">管理孩子的总积分与心愿奖品</p>
      </div>

      <div class="space-y-2 border-b pb-4">
        <label class="block text-sm font-semibold text-slate-700">手动修改总积分</label>
        <div class="flex gap-2">
          <input type="number" id="parent-score-input" class="w-full border rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="设置新的总积分">
          <button onclick="saveParentScore()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-700 font-semibold shrink-0">保存积分</button>
        </div>
      </div>

      <div class="space-y-3 border-b pb-4">
        <h4 class="text-sm font-semibold text-slate-700">添加新的心愿奖品</h4>
        <div class="space-y-2">
          <input type="text" id="new-reward-title" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="奖品名称 (如: 看电影一次)">
          <div class="flex gap-2">
            <input type="number" id="new-reward-cost" class="w-1/2 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="所需积分 (如: 10)">
            <select id="new-reward-icon" class="w-1/2 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="fa-gamepad">🎮 游戏时间</option>
              <option value="fa-ice-cream">🍦 零食美味</option>
              <option value="fa-film">🎬 电影看片</option>
              <option value="fa-plane">🎡 游乐园/出门</option>
              <option value="fa-book">📚 新书/绘本</option>
              <option value="fa-gift">🎁 礼物/玩具</option>
            </select>
          </div>
          <button onclick="addCustomReward()" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg font-semibold text-sm">确认添加奖品</button>
        </div>
      </div>

      <div class="space-y-2 border-b pb-4">
        <h4 class="text-sm font-semibold text-slate-700">当前奖品列表管理 (支持编辑✏️与删除)</h4>
        <div id="parent-rewards-list" class="space-y-2 max-h-48 overflow-y-auto p-1"></div>
      </div>

      <div class="pt-2 flex justify-between items-center">
        <button onclick="clearAllData()" class="text-xs text-red-500 hover:text-red-700 underline">
          重置所有数据(清零积分/恢复默认)
        </button>
        <button onclick="closeParentModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold px-4 py-2 rounded-lg">
          关闭
        </button>
      </div>
    </div>
  </div>

  <!-- Edit Reward Sub-Modal -->
  <div id="edit-reward-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-pen text-emerald-600"></i> 编辑心愿奖品</h3>
      <input type="hidden" id="edit-reward-id">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">奖品名称</label>
        <input type="text" id="edit-reward-title" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">所需积分</label>
        <input type="number" id="edit-reward-cost" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="saveEditedReward()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-semibold">保存修改</button>
        <button onclick="closeEditModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-lg text-sm font-semibold">取消</button>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400">
    苏教版二年级上册学习助手 · 寓教于乐
  </footer>

  <script>
    // 多套苏教版二年级上册精选题库
    const quizDecks = [
      // Deck 1
      [
        {
          id: 1,
          category: "数学 · 连加连减与混合计算",
          question: "计算 45 + 28 - 19 的正确结果是多少？",
          options: [
            { key: "A", text: "54" },
            { key: "B", text: "64" },
            { key: "C", text: "44" },
            { key: "D", text: "73" }
          ],
          answer: "A",
          explanation: "根据从左往右的计算顺序，先算 45 + 28 = 73，再算 73 - 19 = 54。"
        },
        {
          id: 2,
          category: "数学 · 平行四边形的认识",
          question: "关于平行四边形的特点，下面说法正确的是哪一项？",
          options: [
            { key: "A", text: "它有四条边和四个角" },
            { key: "B", text: "四个角必须都是直角" },
            { key: "C", text: "它只有三条边" },
            { key: "D", text: "四条边长度必须全部相等" }
          ],
          answer: "A",
          explanation: "平行四边形属于四边形，具有 4 条边和 4 个角；只有 4 个角都是直角时才是长方形或正方形。"
        },
        {
          id: 3,
          category: "数学 · 表内乘法",
          question: "计算算式 5 × 4 = ?，计算时用到的乘法口诀是哪一个？",
          options: [
            { key: "A", text: "四五二十" },
            { key: "B", text: "五五二十五" },
            { key: "C", text: "三五十五" },
            { key: "D", text: "四六二十四" }
          ],
          answer: "A",
          explanation: "根据乘法口诀“四五二十”，可以算得 5 × 4 = 20。"
        },
        {
          id: 4,
          category: "语文 · 汉字结构与组词",
          question: "苏教版语文二上课文《水乡歌》中的生字“装”，它的结构和部首是什么？",
          options: [
            { key: "A", text: "上下结构，部首是“衣”" },
            { key: "B", text: "左右结构，部首是“壮”" },
            { key: "C", text: "半包围结构，部首是“衣”" },
            { key: "D", text: "上下结构，部首是“壮”" }
          ],
          answer: "A",
          explanation: "“装”字上半部分是“壮”，下半部分是“衣”，属于上下结构，部首是下方的衣字底。"
        },
        {
          id: 5,
          category: "语文 · 古诗背诵与默写",
          question: "请补全宋代诗人王安石《梅花》中的诗句：“遥知不是雪，________________。”",
          options: [
            { key: "A", text: "为有暗香来" },
            { key: "B", text: "粒粒皆辛苦" },
            { key: "C", text: "乡音无改鬓毛衰" },
            { key: "D", text: "处处闻啼鸟" }
          ],
          answer: "A",
          explanation: "《梅花》（宋·王安石）全文为：“墙角数枝梅，凌寒独自开。遥知不是雪，为有暗香来。”"
        }
      ],
      // Deck 2
      [
        {
          id: 1,
          category: "数学 · 表内乘法与乘加",
          question: "算式 5 + 5 + 5 + 3 可以改写成下面哪一个乘加算式？",
          options: [
            { key: "A", text: "5 × 3 + 3" },
            { key: "B", text: "5 × 4 - 3" },
            { key: "C", text: "5 × 3 + 5" },
            { key: "D", text: "5 × 4 + 3" }
          ],
          answer: "A",
          explanation: "5 + 5 + 5 表示 3 个 5 相加（5 × 3），再加上 3 即为 5 × 3 + 3 = 18。"
        },
        {
          id: 2,
          category: "数学 · 长度单位",
          question: "请选择最合适的单位：测量数学课本的厚度大约是 1（ ），小明的身高大约是 130（ ）。",
          options: [
            { key: "A", text: "厘米；厘米" },
            { key: "B", text: "米；厘米" },
            { key: "C", text: "厘米；米" },
            { key: "D", text: "米；米" }
          ],
          answer: "A",
          explanation: "数学课本较薄用“厘米”；小明身高用“厘米”表示最符合实际。"
        },
        {
          id: 3,
          category: "数学 · 角的初步认识",
          question: "用放大镜观察一个角，这个角的大小会发生什么变化？",
          options: [
            { key: "A", text: "保持不变" },
            { key: "B", text: "变大" },
            { key: "C", text: "变小" },
            { key: "D", text: "变成直角" }
          ],
          answer: "A",
          explanation: "角的大小只与两边张开的大小有关。用放大镜看角，边变长了但张开的角度保持不变。"
        },
        {
          id: 4,
          category: "语文 · 汉字结构",
          question: "下面哪一组词语中的字全部都是“全包围结构”？",
          options: [
            { key: "A", text: "团圆、国庆" },
            { key: "B", text: "花园、校园" },
            { key: "C", text: "公园、圆形" },
            { key: "D", text: "树林、同学" }
          ],
          answer: "A",
          explanation: "“团”与“国”均为典型的全包围结构字。"
        },
        {
          id: 5,
          category: "语文 · 古诗积累",
          question: "请补全唐代诗人贺知章《回乡偶书》中的诗句：“少小离家老大回，________________。”",
          options: [
            { key: "A", text: "乡音无改鬓毛衰" },
            { key: "B", text: "黄河入海流" },
            { key: "C", text: "处处闻啼鸟" },
            { key: "D", text: "低头思故乡" }
          ],
          answer: "A",
          explanation: "完整诗句为：“少小离家老大回，乡音无改鬓毛衰。”"
        }
      ],
      // Deck 3
      [
        {
          id: 1,
          category: "数学 · 表内乘法",
          question: "小明在计算 4 × 6 时，用到了口诀“四六二十四”。下面哪个算式不能用这句口诀计算？",
          options: [
            { key: "A", text: "4 + 6" },
            { key: "B", text: "6 × 4" },
            { key: "C", text: "4 + 4 + 4 + 4 + 4 + 4" },
            { key: "D", text: "6 + 6 + 6 + 6" }
          ],
          answer: "A",
          explanation: "4 + 6 是加法算式，不能使用乘法口诀求解；其余选项均表示 4 与 6 的乘法意义。"
        },
        {
          id: 2,
          category: "数学 · 趣题应用",
          question: "公交车上原本有 45 人，到站后下车 18 人，又上车 12 人。现在车上还有多少人？",
          options: [
            { key: "A", text: "39 人" },
            { key: "B", text: "15 人" },
            { key: "C", text: "51 人" },
            { key: "D", text: "27 人" }
          ],
          answer: "A",
          explanation: "45 - 18 + 12 = 39 人。"
        },
        {
          id: 3,
          category: "数学 · 角的识别",
          question: "一个标准的三角板上有几个直角和几个锐角？",
          options: [
            { key: "A", text: "1个直角，2个锐角" },
            { key: "B", text: "2个直角，1个锐角" },
            { key: "C", text: "3个直角，0个锐角" },
            { key: "D", text: "1个直角，1个钝角" }
          ],
          answer: "A",
          explanation: "标准三角板包含 1 个直角和 2 个锐角。"
        },
        {
          id: 4,
          category: "语文 · 字词辨析",
          question: "下面哪一组词语中的字全部都是“左右结构”？",
          options: [
            { key: "A", text: "唱歌、桥梁" },
            { key: "B", text: "园林、圆圈" },
            { key: "C", text: "依靠、花朵" },
            { key: "D", text: "整体、美丽" }
          ],
          answer: "A",
          explanation: "“唱”和“歌”、“桥”和“梁”均为左右（或左中右）结构。"
        },
        {
          id: 5,
          category: "语文 · 古诗背诵",
          question: "唐代诗人李绅在《悯农（其二）》中“谁知盘中餐”的前一句是什么？",
          options: [
            { key: "A", text: "汗滴禾下土" },
            { key: "B", text: "锄禾日当午" },
            { key: "C", text: "春种一粒粟" },
            { key: "D", text: "秋收万颗子" }
          ],
          answer: "A",
          explanation: "原诗为：“锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。”"
        }
      ]
    ];

    const defaultRewards = [
      { id: 1, title: "看动画片 20 分钟", cost: 5, icon: "fa-film", bg: "bg-blue-50 text-blue-600" },
      { id: 2, title: "挑选一款美味小零食", cost: 10, icon: "fa-ice-cream", bg: "bg-pink-50 text-pink-600" },
      { id: 3, title: "玩游戏/玩玩具 30 分钟", cost: 15, icon: "fa-gamepad", bg: "bg-purple-50 text-purple-600" },
      { id: 4, title: "购买一本喜欢的图书/绘本", cost: 25, icon: "fa-book", bg: "bg-amber-50 text-amber-600" }
    ];

    let currentDeckIndex = getDailyDeckIndex();
    let currentQuizData = quizDecks[currentDeckIndex];
    let totalScore = parseInt(localStorage.getItem('total_score')) || 0;
    let submittedToday = localStorage.getItem(`quiz_submitted_${currentDeckIndex}`) === 'true';
    let userAnswers = JSON.parse(localStorage.getItem(`user_answers_${currentDeckIndex}`)) || {};
    let customRewards = JSON.parse(localStorage.getItem('custom_rewards')) || defaultRewards;

    // 根据日期自动计算当天对应的套题序号
    function getDailyDeckIndex() {
      const todayStr = new Date().toISOString().slice(0, 10);
      let hash = 0;
      for (let i = 0; i < todayStr.length; i++) {
        hash += todayStr.charCodeAt(i);
      }
      return hash % quizDecks.length;
    }

    window.onload = function() {
      updateScoreDisplay();
      renderQuiz();
      renderRewards();
    };

    function updateScoreDisplay() {
      document.getElementById('total-score-display').innerText = totalScore;
      localStorage.setItem('total_score', totalScore);
    }

    function shuffleDeck() {
      currentDeckIndex = (currentDeckIndex + 1) % quizDecks.length;
      currentQuizData = quizDecks[currentDeckIndex];
      submittedToday = localStorage.getItem(`quiz_submitted_${currentDeckIndex}`) === 'true';
      userAnswers = JSON.parse(localStorage.getItem(`user_answers_${currentDeckIndex}`)) || {};
      renderQuiz();
    }

    function renderQuiz() {
      document.getElementById('deck-tag').innerText = `套题 ${currentDeckIndex + 1}`;
      const listContainer = document.getElementById('questions-list');
      listContainer.innerHTML = '';

      currentQuizData.forEach((q, index) => {
        const isSelected = userAnswers[q.id];
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-4 transition";

        let optionsHTML = '';
        q.options.forEach(opt => {
          let btnStyle = "border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/50";
          let badgeStyle = "bg-slate-100 text-slate-600";

          if (submittedToday) {
            if (opt.key === q.answer) {
              btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold";
              badgeStyle = "bg-emerald-500 text-white";
            } else if (isSelected === opt.key && isSelected !== q.answer) {
              btnStyle = "border-red-400 bg-red-50 text-red-900 line-through opacity-75";
              badgeStyle = "bg-red-500 text-white";
            } else {
              btnStyle = "border-slate-100 opacity-50";
            }
          } else if (isSelected === opt.key) {
            btnStyle = "border-emerald-500 bg-emerald-50/80 text-emerald-900 font-semibold ring-2 ring-emerald-400/30";
            badgeStyle = "bg-emerald-500 text-white";
          }

          optionsHTML += `
            <label class="flex items-center p-3.5 rounded-xl border-2 cursor-pointer transition ${btnStyle}">
              <input type="radio" name="q_${q.id}" value="${opt.key}" ${isSelected === opt.key ? 'checked' : ''} ${submittedToday ? 'disabled' : ''} onchange="selectOption(${q.id}, '${opt.key}')" class="hidden">
              <span class="w-7 h-7 rounded-lg ${badgeStyle} font-bold flex items-center justify-center text-sm mr-3 shrink-0">${opt.key}</span>
              <span class="text-base">${opt.text}</span>
            </label>
          `;
        });

        let expHTML = '';
        if (submittedToday) {
          const isCorrect = isSelected === q.answer;
          expHTML = `
            <div class="mt-4 p-4 rounded-xl text-sm ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-red-50 border border-red-200 text-red-800'} space-y-1">
              <div class="font-bold flex items-center gap-1.5 text-base">
                ${isCorrect ? '<i class="fa-solid fa-circle-check text-emerald-600"></i> 回答正确 (+1分)' : '<i class="fa-solid fa-circle-xmark text-red-600"></i> 回答错误 (0分)'}
              </div>
              <p><span class="font-semibold">正确答案：</span>${q.answer}</p>
              <p><span class="font-semibold">题目解析：</span>${q.explanation}</p>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-md font-bold">${q.category}</span>
            <span class="text-xs font-semibold text-slate-400">第 ${index + 1} 题 / 1 分</span>
          </div>
          <h3 class="text-lg font-bold text-slate-800">${index + 1}. ${q.question}</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
            ${optionsHTML}
          </div>
          ${expHTML}
        `;

        listContainer.appendChild(card);
      });

      const submitBtn = document.getElementById('submit-btn');
      const resultCard = document.getElementById('quiz-result-card');
      const resetTodayBtn = document.getElementById('reset-today-btn');

      if (submittedToday) {
        submitBtn.classList.add('hidden');
        resultCard.classList.remove('hidden');
        resetTodayBtn.classList.remove('hidden');

        let earned = 0;
        currentQuizData.forEach(q => {
          if (userAnswers[q.id] === q.answer) earned++;
        });

        document.getElementById('result-score-text').innerHTML = `你本次答对 <strong>${earned}</strong> 道题，获得了 <strong>${earned}</strong> 积分！`;
      } else {
        submitBtn.classList.remove('hidden');
        resultCard.classList.add('hidden');
        resetTodayBtn.classList.add('hidden');
      }
    }

    function selectOption(qId, key) {
      if (submittedToday) return;
      userAnswers[qId] = key;
      localStorage.setItem(`user_answers_${currentDeckIndex}`, JSON.stringify(userAnswers));
      renderQuiz();
    }

    function handleQuizSubmit(e) {
      e.preventDefault();
      if (submittedToday) return;

      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount < currentQuizData.length) {
        alert(`还有 ${currentQuizData.length - answeredCount} 道题没做哦，请做完后再提交！`);
        return;
      }

      let earnedPoints = 0;
      currentQuizData.forEach(q => {
        if (userAnswers[q.id] === q.answer) earnedPoints += 1;
      });

      totalScore += earnedPoints;
      submittedToday = true;

      localStorage.setItem(`quiz_submitted_${currentDeckIndex}`, 'true');
      updateScoreDisplay();
      renderQuiz();

      document.getElementById('quiz-result-card').scrollIntoView({ behavior: 'smooth' });
    }

    function resetTodayQuiz() {
      if (confirm("确定要重置当前答题状态吗？（重置不会扣除已获得的积分，可重新测试）")) {
        submittedToday = false;
        userAnswers = {};
        localStorage.removeItem(`quiz_submitted_${currentDeckIndex}`);
        localStorage.removeItem(`user_answers_${currentDeckIndex}`);
        renderQuiz();
      }
    }

    function renderRewards() {
      const grid = document.getElementById('rewards-grid');
      grid.innerHTML = '';

      customRewards.forEach(item => {
        const canAfford = totalScore >= item.cost;
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex items-center justify-between space-x-4";

        card.innerHTML = `
          <div class="flex items-center space-x-4">
            <div class="w-12 h-12 rounded-2xl ${item.bg || 'bg-emerald-50 text-emerald-600'} flex items-center justify-center text-2xl shrink-0">
              <i class="fa-solid ${item.icon || 'fa-gift'}"></i>
            </div>
            <div>
              <h4 class="font-bold text-slate-800 text-base">${item.title}</h4>
              <p class="text-xs text-slate-400 mt-0.5">需要积分: <span class="font-bold text-amber-500">${item.cost}</span> 分</p>
            </div>
          </div>
          <button onclick="redeemReward('${item.title}', ${item.cost})" ${canAfford ? '' : 'disabled'} 
            class="px-4 py-2 rounded-xl text-sm font-bold transition shrink-0 ${canAfford ? 'bg-amber-400 hover:bg-amber-500 text-amber-950 shadow-md active:scale-95' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
            ${canAfford ? '兑换' : '积分不足'}
          </button>
        `;

        grid.appendChild(card);
      });

      renderParentRewardsList();
    }

    function redeemReward(title, cost) {
      if (totalScore >= cost) {
        if (confirm(`确定要消耗 ${cost} 积分兑换“${title}”吗？`)) {
          totalScore -= cost;
          updateScoreDisplay();
          renderRewards();
          alert(`🎉 兑换成功！快去找爸爸妈妈兑换奖品【${title}】吧！`);
        }
      }
    }

    function openParentModal() {
      document.getElementById('parent-score-input').value = totalScore;
      document.getElementById('parent-modal').classList.remove('hidden');
      renderParentRewardsList();
    }

    function closeParentModal() {
      document.getElementById('parent-modal').classList.add('hidden');
    }

    function saveParentScore() {
      const val = parseInt(document.getElementById('parent-score-input').value);
      if (!isNaN(val) && val >= 0) {
        totalScore = val;
        updateScoreDisplay();
        renderRewards();
        alert('总积分已保存修改！');
      } else {
        alert('请输入有效的积分数值！');
      }
    }

    function addCustomReward() {
      const title = document.getElementById('new-reward-title').value.trim();
      const cost = parseInt(document.getElementById('new-reward-cost').value);
      const icon = document.getElementById('new-reward-icon').value;

      if (!title || isNaN(cost) || cost <= 0) {
        alert('请填写完整的奖品名称和正确的所需要积分！');
        return;
      }

      customRewards.push({
        id: Date.now(),
        title: title,
        cost: cost,
        icon: icon,
        bg: "bg-emerald-50 text-emerald-600"
      });

      localStorage.setItem('custom_rewards', JSON.stringify(customRewards));
      document.getElementById('new-reward-title').value = '';
      document.getElementById('new-reward-cost').value = '';
      renderRewards();
      alert('已成功添加新心愿奖品！');
    }

    function removeReward(id) {
      if (confirm('确定要删除这个奖品吗？')) {
        customRewards = customRewards.filter(r => r.id !== id);
        localStorage.setItem('custom_rewards', JSON.stringify(customRewards));
        renderRewards();
      }
    }

    function openEditModal(id) {
      const reward = customRewards.find(r => r.id === id);
      if (!reward) return;
      document.getElementById('edit-reward-id').value = reward.id;
      document.getElementById('edit-reward-title').value = reward.title;
      document.getElementById('edit-reward-cost').value = reward.cost;
      document.getElementById('edit-reward-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-reward-modal').classList.add('hidden');
    }

    function saveEditedReward() {
      const id = parseInt(document.getElementById('edit-reward-id').value);
      const title = document.getElementById('edit-reward-title').value.trim();
      const cost = parseInt(document.getElementById('edit-reward-cost').value);

      if (!title || isNaN(cost) || cost <= 0) {
        alert('请填写有效的名称和积分！');
        return;
      }

      customRewards = customRewards.map(r => r.id === id ? { ...r, title, cost } : r);
      localStorage.setItem('custom_rewards', JSON.stringify(customRewards));
      closeEditModal();
      renderRewards();
      alert('奖品修改成功！');
    }

    function renderParentRewardsList() {
      const container = document.getElementById('parent-rewards-list');
      if (!container) return;
      container.innerHTML = '';

      customRewards.forEach(r => {
        const item = document.createElement('div');
        item.className = "flex justify-between items-center bg-slate-50 p-2 rounded-lg text-sm border";
        item.innerHTML = `
          <span class="text-slate-700 font-medium truncate max-w-[180px]">${r.title} (${r.cost}分)</span>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="openEditModal(${r.id})" class="text-blue-500 hover:text-blue-700 p-1.5" title="编辑">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="removeReward(${r.id})" class="text-red-500 hover:text-red-700 p-1.5" title="删除">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function clearAllData() {
      if (confirm("⚠️ 确定要清空所有数据吗？（总积分清零、清除所有答题记录并恢复默认奖品）")) {
        localStorage.clear();
        totalScore = 0;
        submittedToday = false;
        userAnswers = {};
        customRewards = defaultRewards;
        updateScoreDisplay();
        renderQuiz();
        renderRewards();
        closeParentModal();
        alert('所有数据已恢复重置！');
      }
    }

    function switchTab(tab) {
      const quizContainer = document.getElementById('quiz-container');
      const shopContainer = document.getElementById('shop-container');
      const quizBtn = document.getElementById('tab-quiz-btn');
      const shopBtn = document.getElementById('tab-shop-btn');

      if (tab === 'quiz') {
        quizContainer.classList.remove('hidden');
        shopContainer.classList.add('hidden');
        quizBtn.className = "px-6 py-2 rounded-full font-bold text-lg shadow-md transition bg-amber-400 text-amber-950 scale-105";
        shopBtn.className = "px-6 py-2 rounded-full font-bold text-lg shadow-md transition bg-white text-emerald-700 hover:bg-emerald-50";
      } else {
        quizContainer.classList.add('hidden');
        shopContainer.classList.remove('hidden');
        shopBtn.className = "px-6 py-2 rounded-full font-bold text-lg shadow-md transition bg-amber-400 text-amber-950 scale-105";
        quizBtn.className = "px-6 py-2 rounded-full font-bold text-lg shadow-md transition bg-white text-emerald-700 hover:bg-emerald-50";
      }
    }
  </script>
</body>
</html>
